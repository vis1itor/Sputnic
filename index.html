<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlackHole Messenger</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b0b0b;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #1a1a1a;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }
        /* Auth */
        #auth {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            gap: 16px;
        }
        #auth h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #7b2ffc, #b06aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 8px;
        }
        #auth input {
            background: #2a2a2a;
            border: none;
            padding: 14px 16px;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        #auth input:focus {
            background: #333;
            box-shadow: 0 0 0 2px #7b2ffc;
        }
        #auth button {
            background: #7b2ffc;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        #auth button:hover {
            background: #6a1fdb;
        }
        #auth .switch {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
        }
        #auth .switch span {
            color: #7b2ffc;
            font-weight: 600;
        }
        #auth .error {
            color: #ff6b6b;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }
        /* Main */
        #main {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        /* Header */
        .header {
            padding: 16px 20px;
            background: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .header h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .header .logout {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
        }
        .header .logout:hover {
            color: #ff6b6b;
        }
        /* Chat list */
        #chatList {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-item {
            background: #252525;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item:hover {
            background: #303030;
        }
        .chat-item .name {
            font-weight: 500;
        }
        .chat-item .members {
            font-size: 12px;
            color: #888;
        }
        /* Floating + */
        .fab {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #7b2ffc;
            color: #fff;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(123, 47, 252, 0.4);
            transition: 0.2s;
            z-index: 10;
        }
        .fab:hover {
            transform: scale(1.05);
        }
        /* Dropdown menu */
        #menuDropdown {
            display: none;
            position: absolute;
            bottom: 90px;
            right: 24px;
            background: #252525;
            border-radius: 16px;
            padding: 8px 0;
            min-width: 180px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            z-index: 20;
            flex-direction: column;
        }
        #menuDropdown .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
            border-bottom: 1px solid #333;
        }
        #menuDropdown .menu-item:last-child {
            border-bottom: none;
        }
        #menuDropdown .menu-item:hover {
            background: #333;
        }
        #menuDropdown .menu-item.disabled {
            color: #666;
            cursor: not-allowed;
        }
        /* Chat view */
        #chatView {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        #chatView .chat-header {
            padding: 16px 20px;
            background: #222;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        #chatView .chat-header .back {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        #chatView .chat-header .title {
            font-weight: 600;
            font-size: 16px;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #141414;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            word-wrap: break-word;
            background: #2a2a2a;
            align-self: flex-start;
        }
        .message.own {
            background: #7b2ffc;
            align-self: flex-end;
        }
        .message .sender {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 2px;
        }
        .message.own .sender {
            color: #c9b0ff;
        }
        .message .time {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }
        .msg-input-area {
            padding: 12px 16px;
            background: #1f1f1f;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .msg-input-area input {
            flex: 1;
            background: #2a2a2a;
            border: none;
            padding: 12px 16px;
            border-radius: 24px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .msg-input-area input:focus {
            background: #333;
        }
        .msg-input-area button {
            background: #7b2ffc;
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
        }
        .msg-input-area button:hover {
            background: #6a1fdb;
        }
        /* Create chat modal */
        #createChatModal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 30;
        }
        #createChatModal .modal-box {
            background: #222;
            padding: 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #createChatModal .modal-box h3 {
            text-align: center;
        }
        #createChatModal .modal-box input {
            background: #2a2a2a;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #createChatModal .modal-box input:focus {
            background: #333;
        }
        #createChatModal .modal-box .actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        #createChatModal .modal-box .actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        #createChatModal .modal-box .actions .cancel {
            background: #333;
            color: #fff;
        }
        #createChatModal .modal-box .actions .create {
            background: #7b2ffc;
            color: #fff;
        }
        /* Scroll */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #7b2ffc; border-radius: 8px; }
    </style>
</head>
<body>
<div id="app">

    <!-- AUTH -->
    <div id="auth">
        <h1>BlackHole</h1>
        <div class="error" id="authError"></div>
        <input type="email" id="emailInput" placeholder="Email" />
        <input type="password" id="passwordInput" placeholder="Пароль" />
        <button id="authBtn">Войти</button>
        <div class="switch" id="switchAuth">Нет аккаунта? <span>Зарегистрироваться</span></div>
    </div>

    <!-- MAIN -->
    <div id="main">
        <div class="header">
            <h2>Чаты</h2>
            <button class="logout" id="logoutBtn">Выйти</button>
        </div>
        <div id="chatList"></div>
        <button class="fab" id="fabBtn">+</button>
        <!-- Dropdown -->
        <div id="menuDropdown">
            <div class="menu-item" data-action="createChat">Create Chat</div>
            <div class="menu-item disabled">Create Bulletin (Under development)</div>
            <div class="menu-item disabled">Create Channel (Under development)</div>
            <div class="menu-item disabled">Create Community (Under development)</div>
            <div class="menu-item disabled">Create Group (Under development)</div>
        </div>
    </div>

    <!-- CHAT VIEW -->
    <div id="chatView">
        <div class="chat-header">
            <button class="back" id="backBtn">←</button>
            <span class="title" id="chatTitle">Чат</span>
        </div>
        <div id="messages"></div>
        <div class="msg-input-area">
            <input type="text" id="msgInput" placeholder="Сообщение..." />
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <!-- CREATE CHAT MODAL -->
    <div id="createChatModal">
        <div class="modal-box">
            <h3>Создать чат</h3>
            <input type="text" id="chatNameInput" placeholder="Название чата" />
            <input type="email" id="chatMemberInput" placeholder="Email участника" />
            <div class="actions">
                <button class="cancel" id="modalCancel">Отмена</button>
                <button class="create" id="modalCreate">Создать</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== FIREBASE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyC6J2lDt-ia1yQqrMoJ7OF7tQMJ0jNNmRo",
        authDomain: "blackhole-team.firebaseapp.com",
        projectId: "blackhole-team",
        storageBucket: "blackhole-team.firebasestorage.app",
        messagingSenderId: "560063023296",
        appId: "1:560063023296:web:91dfb5bf838bfedf800525"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ========== DOM ==========
    const authDiv = document.getElementById('auth');
    const mainDiv = document.getElementById('main');
    const chatView = document.getElementById('chatView');
    const chatList = document.getElementById('chatList');
    const messagesDiv = document.getElementById('messages');
    const chatTitle = document.getElementById('chatTitle');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const backBtn = document.getElementById('backBtn');
    const fabBtn = document.getElementById('fabBtn');
    const menuDropdown = document.getElementById('menuDropdown');
    const createChatModal = document.getElementById('createChatModal');
    const chatNameInput = document.getElementById('chatNameInput');
    const chatMemberInput = document.getElementById('chatMemberInput');
    const modalCancel = document.getElementById('modalCancel');
    const modalCreate = document.getElementById('modalCreate');
    const authBtn = document.getElementById('authBtn');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const switchAuth = document.getElementById('switchAuth');
    const authError = document.getElementById('authError');
    const logoutBtn = document.getElementById('logoutBtn');

    let isLogin = true;
    let currentUser = null;
    let currentChatId = null;
    let unsubscribeMessages = null;

    // ========== AUTH ==========
    function setAuthMode(login) {
        isLogin = login;
        authBtn.textContent = login ? 'Войти' : 'Зарегистрироваться';
        switchAuth.innerHTML = login ? 'Нет аккаунта? <span>Зарегистрироваться</span>' : 'Уже есть аккаунт? <span>Войти</span>';
        authError.textContent = '';
    }

    switchAuth.addEventListener('click', () => setAuthMode(!isLogin));

    authBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const pass = passwordInput.value.trim();
        if (!email || !pass) { authError.textContent = 'Заполните все поля'; return; }
        authError.textContent = '';
        try {
            if (isLogin) {
                await auth.signInWithEmailAndPassword(email, pass);
            } else {
                await auth.createUserWithEmailAndPassword(email, pass);
            }
        } catch (e) {
            authError.textContent = e.message;
        }
    });

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            authDiv.style.display = 'none';
            mainDiv.style.display = 'flex';
            chatView.style.display = 'none';
            loadChats();
            // set user presence
            db.collection('users').doc(user.uid).set({ email: user.email, uid: user.uid }, { merge: true });
        } else {
            currentUser = null;
            authDiv.style.display = 'flex';
            mainDiv.style.display = 'none';
            chatView.style.display = 'none';
            if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
        }
    });

    logoutBtn.addEventListener('click', () => auth.signOut());

    // ========== CHATS ==========
    async function loadChats() {
        if (!currentUser) return;
        const snapshot = await db.collection('chats')
            .where('members', 'array-contains', currentUser.uid)
            .orderBy('updatedAt', 'desc')
            .get();
        chatList.innerHTML = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div');
            div.className = 'chat-item';
            const memberEmails = data.memberEmails || [];
            const displayName = data.name || memberEmails.filter(e => e !== currentUser.email).join(', ') || 'Чат';
            div.innerHTML = `<span class="name">${displayName}</span><span class="members">${memberEmails.length} участ.</span>`;
            div.addEventListener('click', () => openChat(doc.id));
            chatList.appendChild(div);
        });
        if (snapshot.empty) {
            chatList.innerHTML = '<div style="text-align:center;color:#666;padding:40px 0;">Нет чатов. Нажмите + чтобы создать</div>';
        }
    }

    // ========== CREATE CHAT ==========
    fabBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuDropdown.style.display = menuDropdown.style.display === 'flex' ? 'none' : 'flex';
    });
    document.addEventListener('click', () => menuDropdown.style.display = 'none');

    document.querySelectorAll('[data-action="createChat"]').forEach(el => {
        el.addEventListener('click', () => {
            menuDropdown.style.display = 'none';
            createChatModal.style.display = 'flex';
            chatNameInput.value = '';
            chatMemberInput.value = '';
        });
    });

    modalCancel.addEventListener('click', () => createChatModal.style.display = 'none');
    modalCreate.addEventListener('click', async () => {
        const name = chatNameInput.value.trim() || 'Новый чат';
        const memberEmail = chatMemberInput.value.trim();
        if (!memberEmail) { alert('Введите email участника'); return; }
        if (memberEmail === currentUser.email) { alert('Нельзя добавить себя'); return; }
        try {
            // find user by email
            const usersSnap = await db.collection('users').where('email', '==', memberEmail).get();
            if (usersSnap.empty) { alert('Пользователь с таким email не найден'); return; }
            const memberUid = usersSnap.docs[0].id;
            const members = [currentUser.uid, memberUid];
            const memberEmails = [currentUser.email, memberEmail];
            await db.collection('chats').add({
                name: name,
                members: members,
                memberEmails: memberEmails,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdBy: currentUser.uid
            });
            createChatModal.style.display = 'none';
            loadChats();
        } catch (e) { alert('Ошибка: ' + e.message); }
    });

    // ========== OPEN CHAT ==========
    async function openChat(chatId) {
        currentChatId = chatId;
        mainDiv.style.display = 'none';
        chatView.style.display = 'flex';
        const doc = await db.collection('chats').doc(chatId).get();
        if (!doc.exists) return;
        const data = doc.data();
        const memberEmails = data.memberEmails || [];
        const displayName = data.name || memberEmails.filter(e => e !== currentUser.email).join(', ') || 'Чат';
        chatTitle.textContent = displayName;

        // load messages
        if (unsubscribeMessages) unsubscribeMessages();
        messagesDiv.innerHTML = '';
        unsubscribeMessages = db.collection('chats').doc(chatId).collection('messages')
            .orderBy('createdAt', 'asc')
            .onSnapshot(snapshot => {
                messagesDiv.innerHTML = '';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = 'message' + (msg.senderId === currentUser.uid ? ' own' : '');
                    const senderEmail = msg.senderEmail || 'unknown';
                    const time = msg.createdAt ? msg.createdAt.toDate().toLocaleTimeString() : '';
                    div.innerHTML = `
                        <div class="sender">${senderEmail}</div>
                        ${msg.text}
                        <div class="time">${time}</div>
                    `;
                    messagesDiv.appendChild(div);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
    }

    backBtn.addEventListener('click', () => {
        if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
        chatView.style.display = 'none';
        mainDiv.style.display = 'flex';
        loadChats();
    });

    // ========== SEND MESSAGE ==========
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !currentChatId || !currentUser) return;
        msgInput.value = '';
        try {
            await db.collection('chats').doc(currentChatId).collection('messages').add({
                text: text,
                senderId: currentUser.uid,
                senderEmail: currentUser.email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            await db.collection('chats').doc(currentChatId).update({
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (e) { alert('Ошибка отправки: ' + e.message); }
    }

    // ========== INIT ==========
    setAuthMode(true);
    console.log('🔥 BlackHole Messenger ready');
</script>
</body>
</html>
