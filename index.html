<html lang="ru">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 20%, #0f1f12, #050d08);

    .app {
      max-width: 1200px;
      width: 100%;
      background: rgba(18, 45, 30, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2rem;
      padding: 1.2rem 1.2rem 1rem;
      border: 1px solid rgba(100, 220, 150, 0.12);
      box-shadow: 0 40px 80px rgba(0,0,0,0.8);
      min-height: 600px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* СТИЛИ КАК В ПРЕДЫДУЩЕЙ ВЕРСИИ (сокращено для длины) */
    .auth-overlay, .header, .settings-menu, .content, .chat-list, .search-bar,
    .chat-area, .chat-header, .create-menu, .custom-modal, .send-form,
    .message-wrapper, .message, .empty-messages, .chat-settings-overlay {
      /* все стили остаются как в предыдущем коде */
    }

    /* ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ ФАЙЛОВ И УДАЛЕНИЯ */
    .message .file-attachment {
      background: rgba(60,200,120,0.05);
      border: 1px solid rgba(80,200,120,0.05);
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
      margin: 0.2rem 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .message .file-attachment:hover { background: rgba(60,200,120,0.08); }
    .message .file-attachment i { font-size: 1.2rem; color: #6fcf97; }
    .message .file-attachment .file-name {
      flex: 1;
      font-size: 0.75rem;
      color: #b5dac8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .message .file-attachment .file-size {
      font-size: 0.6rem;
      color: rgba(130,200,160,0.2);
    }
    .message .msg-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.2rem;
      opacity: 0;
      transition: 0.2s;
    }
    .message-wrapper:hover .msg-actions { opacity: 1; }
    .message .msg-actions button {
      background: none;
      border: none;
      color: rgba(130,200,160,0.1);
      cursor: pointer;
      font-size: 0.6rem;
      transition: 0.2s;
      padding: 0.1rem 0.3rem;
    }
    .message .msg-actions button:hover { color: #6fcf97; }
    .message .msg-actions .delete-for-all { color: rgba(255,100,100,0.1); }
    .message .msg-actions .delete-for-all:hover { color: #ff6b6b; }

    /* АДАПТИВ КАК В ПРЕДЫДУЩЕЙ ВЕРСИИ */
    @media (max-width: 700px) { /* ... */ }
    @media (max-width: 480px) { /* ... */ }
  </style>
</head>
<body>
<!-- ВСЯ РАЗМЕТКА КАК В ПРЕДЫДУЩЕЙ ВЕРСИИ, НО С ИЗМЕНЕНИЯМИ В JS -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    getDocs,
    onSnapshot,
    orderBy,
    serverTimestamp,
    updateDoc,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    writeBatch
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

  // ===== КОНФИГ =====
  const firebaseConfig = {
    apiKey: "AIzaSyBjvB9O3hsn4en7oexjDNr_Ad30LorEJYA",
    authDomain: "sputnik-e9f74.firebaseapp.com",
    projectId: "sputnik-e9f74",
    storageBucket: "sputnik-e9f74.firebasestorage.app",
    messagingSenderId: "426394306019",
    appId: "1:426394306019:web:df8ea34fef8be3877f4cd6",
    measurementId: "G-C20YYXMCQM"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  // ===== DOM =====
  // (все элементы как в предыдущей версии)

  // ===== КАСТОМНАЯ МОДАЛКА =====
  // (как в предыдущей версии)

  // ===== СОСТОЯНИЕ =====
  let currentUser = null;
  let currentUserEmail = '';
  let chats = [];
  let activeChatId = null;
  let activeChatData = null;
  let messagesUnsubscribe = null;

  // ===== ФУНКЦИИ =====

  // ПОКАЗАТЬ МОДАЛКУ (как в предыдущей версии)
  function showModal(title, message, inputPlaceholder = null) { /* ... */ }

  // ОТОБРАЖЕНИЕ ЧАТОВ (как в предыдущей версии)
  function renderChats(filter = '') { /* ... */ }

  // ===== ЗАГРУЗКА СООБЩЕНИЙ С ФАЙЛАМИ И КНОПКАМИ УДАЛЕНИЯ =====
  async function loadMessages(chatId) {
    if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
    messagesContainer.innerHTML = '';
    try {
      const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('timestamp', 'asc'));
      messagesUnsubscribe = onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = '';
        let hasMessages = false;
        snapshot.forEach(doc => {
          hasMessages = true;
          const data = doc.data();
          const messageId = doc.id;
          const isSent = data.sender === currentUserEmail;
          const isDeleted = data.deleted === true;
          const isDeletedForAll = data.deletedForAll === true;
          
          // Если сообщение удалено для всех — не показываем
          if (isDeletedForAll) return;
          
          const time = data.timestamp?.toDate?.() || new Date();
          const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          const wrapper = document.createElement('div');
          wrapper.className = `message-wrapper ${isSent ? 'sent' : 'received'}`;
          
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
          
          // Контент сообщения
          let content = '';
          
          // Если удалено для отправителя, но не для всех
          if (isDeleted && !isDeletedForAll) {
            content = '<span style="opacity:0.2;font-style:italic;">Сообщение удалено</span>';
          } else {
            // Текст
            if (data.text) content += data.text;
            
            // Файл
            if (data.fileUrl) {
              const fileName = data.fileName || 'Файл';
              const fileSize = data.fileSize ? formatFileSize(data.fileSize) : '';
              const isImage = data.fileType && data.fileType.startsWith('image/');
              
              if (isImage) {
                content += `<img src="${data.fileUrl}" alt="Фото" style="max-width:200px;max-height:200px;border-radius:12px;margin:4px 0;">`;
              } else {
                content += `
                  <div class="file-attachment" onclick="window.open('${data.fileUrl}', '_blank')">
                    <i class="fas ${getFileIcon(data.fileType)}"></i>
                    <span class="file-name">${fileName}</span>
                    <span class="file-size">${fileSize}</span>
                    <i class="fas fa-download" style="font-size:0.7rem;opacity:0.3;"></i>
                  </div>
                `;
              }
            }
          }
          
          // Отправитель
          if (data.sender && !isSent && !isDeleted) {
            const senderClass = activeChatData?.type === 'group' ? 'group-sender' : '';
            content = `<span class="msg-sender ${senderClass}">${data.sender}</span>` + content;
          }
          
          msgDiv.innerHTML = `${content}<span class="msg-time">${timeStr}</span>`;
          
          // Кнопки удаления (только для своих сообщений)
          if (isSent && !isDeleted) {
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            actions.innerHTML = `
              <button class="delete-for-me" data-msgid="${messageId}" title="Удалить у себя"><i class="fas fa-trash-alt"></i></button>
              <button class="delete-for-all" data-msgid="${messageId}" title="Удалить у всех"><i class="fas fa-trash-alt"></i> ✕</button>
            `;
            msgDiv.appendChild(actions);
            
            // Удаление у себя
            actions.querySelector('.delete-for-me').addEventListener('click', (e) => {
              e.stopPropagation();
              deleteMessage(messageId, 'me');
            });
            
            // Удаление у всех
            actions.querySelector('.delete-for-all').addEventListener('click', (e) => {
              e.stopPropagation();
              deleteMessage(messageId, 'all');
            });
          }
          
          wrapper.appendChild(msgDiv);
          messagesContainer.appendChild(wrapper);
        });
        
        if (!hasMessages) {
          messagesContainer.innerHTML = `<div class="empty-messages"><i class="fas fa-comment-dots" style="font-size:2rem; opacity:0.05; display:block; margin-bottom:0.3rem;"></i><span>начните общение</span></div>`;
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    } catch (e) { console.error('loadMessages error:', e); }
  }

  // ===== УДАЛЕНИЕ СООБЩЕНИЙ =====
  async function deleteMessage(messageId, type) {
    if (!activeChatId) return;
    
    const confirmMsg = type === 'all' 
      ? '🗑️ Удалить это сообщение у ВСЕХ участников?'
      : '🗑️ Удалить это сообщение только у себя?';
    
    const result = await showModal('Удаление', confirmMsg);
    if (!result) return;
    
    try {
      const msgRef = doc(db, 'chats', activeChatId, 'messages', messageId);
      
      if (type === 'all') {
        // Удаляем у всех — помечаем как deletedForAll
        await updateDoc(msgRef, { 
          deletedForAll: true,
          deletedAt: serverTimestamp()
        });
        // Удаляем файл из Storage, если есть
        const msgDoc = await getDoc(msgRef);
        if (msgDoc.exists()) {
          const data = msgDoc.data();
          if (data.fileUrl) {
            try {
              const fileRef = ref(storage, data.fileUrl);
              await deleteObject(fileRef);
            } catch (e) { console.warn('Файл уже удалён'); }
          }
        }
      } else {
        // Удаляем только у себя
        await updateDoc(msgRef, { 
          deleted: true,
          deletedAt: serverTimestamp()
        });
      }
      
      await showModal('✅ Готово', 'Сообщение удалено!');
    } catch (e) {
      console.error('deleteMessage error:', e);
      await showModal('❌ Ошибка', e.message);
    }
  }

  // ===== ОТПРАВКА СООБЩЕНИЙ С ФАЙЛАМИ =====
  async function sendMessage(text, file = null) {
    if (!activeChatId) return;
    if (!text.trim() && !file) return;
    
    try {
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
      
      const messageData = {
        sender: currentUserEmail,
        timestamp: serverTimestamp()
      };
      
      if (text.trim()) messageData.text = text.trim();
      
      // Загрузка файла
      if (file) {
        const filePath = `chats/${activeChatId}/${Date.now()}_${file.name}`;
        const storageRef = ref(storage, filePath);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        
        messageData.fileUrl = url;
        messageData.fileName = file.name;
        messageData.fileSize = file.size;
        messageData.fileType = file.type;
        messageData.filePath = filePath;
      }
      
      await addDoc(collection(db, 'chats', activeChatId, 'messages'), messageData);
      
      const lastMsg = text.trim() || (file ? '📎 Файл' : '');
      await updateDoc(doc(db, 'chats', activeChatId), {
        lastMessage: lastMsg,
        lastMessageTime: serverTimestamp()
      });
      
      messageInput.value = '';
    } catch (e) {
      console.error('sendMessage error:', e);
      await showModal('❌ Ошибка', e.message);
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
    }
  }

  // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function getFileIcon(mimeType) {
    if (!mimeType) return 'fa-file';
    if (mimeType.startsWith('image/')) return 'fa-file-image';
    if (mimeType.startsWith('video/')) return 'fa-file-video';
    if (mimeType.startsWith('audio/')) return 'fa-file-audio';
    if (mimeType.includes('pdf')) return 'fa-file-pdf';
    if (mimeType.includes('zip') || mimeType.includes('rar')) return 'fa-file-archive';
    if (mimeType.includes('word') || mimeType.includes('document')) return 'fa-file-word';
    if (mimeType.includes('excel') || mimeType.includes('sheet')) return 'fa-file-excel';
    return 'fa-file';
  }

  // ===== ОСТАЛЬНЫЕ ФУНКЦИИ (создание чатов, регистрация и т.д.) =====
  // (всё как в предыдущей версии, с использованием showModal)

  // ===== СОБЫТИЯ =====
  // ОТПРАВКА ФАЙЛА
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      const file = e.target.files[0];
      const text = messageInput.value;
      sendMessage(text, file);
      fileInput.value = '';
    }
  });

  // ОТПРАВКА ТЕКСТА
  sendForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = messageInput.value;
    if (text.trim()) {
      sendMessage(text);
    }
  });

  // КНОПКА ДЛЯ ВЫБОРА ФАЙЛА (МОЖНО НЕСКОЛЬКО ТИПОВ)
  // В HTML добавить: <input type="file" id="fileInput" style="display:none;">
  // И кнопку: <button type="button" id="attachBtn"><i class="fas fa-paperclip"></i></button>

  // ВСЁ ОСТАЛЬНОЕ (регистрация, создание чатов, настройки) — как в предыдущей версии
  // с использованием showModal вместо alert/prompt

</script>
</body>
</html>
